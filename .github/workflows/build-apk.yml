name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install NDK and CMake
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "ndk;27.0.12077973" "cmake;4.1.2" "platforms;android-36" || true
          echo "### SDK check" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -1 "$ANDROID_HOME/cmake" >> $GITHUB_STEP_SUMMARY 2>&1 || true
          ls -l "$ANDROID_HOME/cmake/4.1.2/bin/cmake" >> $GITHUB_STEP_SUMMARY 2>&1 || echo "cmake 4.1.2 MISSING" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Build debug APK
        run: |
          cd MiniCPM-V-demo-Android
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/b.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "### gradle failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -n -E "FAILURE:|What went wrong|^e: |error:|Caused by" /tmp/b.log | head -50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### tail" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -80 /tmp/b.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "e: file|CMake Error|Unresolved|FAILURE:" /tmp/b.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit $rc
          fi

      - name: Show errors
        if: failure()
        run: |
          txt=$(sed -n '/What went wrong/,$p' /tmp/b.log 2>/dev/null | head -12)
          [ -z "$txt" ] && txt=$(tail -12 /tmp/b.log 2>/dev/null)
          [ -z "$txt" ] && txt="gradle log missing"
          echo "$txt" | while IFS= read -r l; do echo "::error::$l"; done

      - name: Show errors
        if: failure()
        run: |
          txt=$(sed -n '/What went wrong/,$p' /tmp/b.log 2>/dev/null | head -12)
          [ -z "$txt" ] && txt=$(tail -12 /tmp/b.log 2>/dev/null)
          [ -z "$txt" ] && txt="gradle log missing"
          echo "$txt" | while IFS= read -r l; do echo "::error::$l"; done
